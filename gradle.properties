# Fabric Properties
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17.17

# Mod Properties
mod_version=0.1.0-indev.1
maven_group=com.server_optimize

# Dependencies
fabric_api_version=0.141.4+1.21.11

# JVM args
org.gradle.jvmargs=-Xmx2G

# Disable Fabric Loom lock file mechanism on Windows (avoids RmStartSession issues)
fabric.loom.lockFileType=NONE

# Custom temp directory to avoid Windows temp permission issues
# systemProp.java.io.tmpdir was a machine-specific absolute path (I:\Userdata\...) that breaks\n# builds on other machines; removed for portability. Re-add locally if your Windows temp\n# directory has permission issues (never commit it).
